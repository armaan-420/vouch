<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vouch — Admin access</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin-login.css"></head>
<body><main class="admin-login"><a class="wordmark" href="/">vouch<span aria-hidden="true">✳</span></a><section class="admin-login-card" aria-labelledby="login-heading"><p class="eyebrow">ORGANIZER WORKSPACE</p><h1 id="login-heading">Enter your PIN</h1><p>Unlock the admin workspace. This browser will remember you for 24 hours.</p><form id="admin-login-form"><label for="admin-pin">Admin PIN</label><input id="admin-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" required autofocus aria-describedby="admin-login-status"><button class="primary" type="submit">Unlock workspace</button><p id="admin-login-status" role="status" aria-live="polite"></p></form><a class="small-link" href="/">← Back to Vouch</a></section></main><script src="/admin-login.js"></script></body></html>
